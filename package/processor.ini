[Processor]
Name=PE app packages
Description=Turns PE app packages (.mod) into Apps
Author=AutoBleem team
Version=1.4.0
Exec=bin/{key}/pe
; every *.mod in the Mods folder before a scan; the Apps it makes are written to Apps/
Kinds=mods
Match=*.mod
Systems=
Order=20
Timeout=120
Modifies=true
; on from the start: the launcher turns it on the first time it meets it (a user's later Off stays)
Default=on
